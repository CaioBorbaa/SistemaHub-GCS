{% extends "layout.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">

    <div class="w-full max-w-lg bg-white p-10 rounded-xl shadow-2xl border-t-4 border-orange-500">
        
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='images/logo_azul_laranja.png') }}" alt="Logo Tintomax" class="h-12 mx-auto mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Acesso ao Hub</h1>
            <p class="text-gray-500 mt-2">Por favor, utilize seu CPF para entrar.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-6">
                <label for="cpf" class="block text-gray-700 font-bold mb-2">CPF</label>
                <input type="text" id="cpf" name="cpf" 
                       class="w-full px-4 py-3 text-lg border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all" 
                       placeholder="000.000.000-00"
                       required
                       oninput="this.value = formatCPF(this.value)">
            </div>
            
            {% if error %}
                <div class="bg-red-100 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded-lg mb-6" role="alert">
                    <p class="font-bold">Acesso Negado</p>
                    <p>{{ error }}</p>
                </div>
            {% endif %}

            <button type="submit" 
                    class="w-full bg-brand-orange text-white font-bold py-3 px-4 rounded-lg hover:opacity-90 transition-opacity duration-300 flex items-center justify-center gap-2 text-lg">
                <span>Entrar</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>
    </div>
</div>

<script>
    // Script de formatação do CPF (robusto e sem alterações)
    function formatCPF(value) {
        const cpfDigits = value.replace(/\D/g, "");
        const truncatedCpf = cpfDigits.slice(0, 11);
        return truncatedCpf
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    }
</script>
{% endblock %}
