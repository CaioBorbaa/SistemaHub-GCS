<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hub Tintomax{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header Principal (Agora limpo, sem informações do usuário) -->
    <header class="bg-brand-orange text-white shadow-lg">
        <div class="flex justify-between items-center px-6 py-2 max-w-7xl mx-auto">
            
            <!-- Relógio (Esquerda) -->
            <div class="flex-1 flex justify-start">
                <div id="clock">
                    <!-- O JavaScript preenche este espaço -->
                </div>
            </div>
            
            <!-- Logo (Centro) -->
            <div class="flex-1 text-center">
                <a href="{{ url_for('home') if session.user_id else url_for('login') }}">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" 
                         alt="Logo Tintomax" 
                         class="h-12 mx-auto">
                </a>
            </div>
            
            <!-- Clima Local (Direita) -->
            <div class="flex-1 flex justify-end">
                <div id="local-weather" class="text-right">
                    <!-- O JavaScript preenche este espaço -->
                </div>
            </div>
            
        </div>
    </header>

    <!-- Espaço para Banner (opcional, preenchido pelo index.html) -->
    {% block banner %}{% endblock %}

    <!-- Área de Conteúdo Principal -->
    <main class="container mx-auto px-6 py-8 flex-1">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer Fixo -->
    <footer class="bg-brand-orange text-white text-center py-4 text-sm font-bold w-full mt-auto">
        Desenvolvido pelo Setor de T.I.
    </footer>
    
    <!-- Painel do Usuário Flutuante (só aparece se o usuário estiver logado) -->
    {% if session.user_name %}
    <div x-data="{ open: false }" class="fixed bottom-5 right-5 z-20">
        <!-- O Menu Pop-over -->
        <div x-show="open" 
             @click.away="open = false"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 transform translate-y-2"
             x-transition:enter-end="opacity-100 transform translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 transform translate-y-0"
             x-transition:leave-end="opacity-0 transform translate-y-2"
             class="absolute bottom-16 right-0 w-64 bg-white rounded-lg shadow-2xl border border-gray-200 overflow-hidden"
             style="display: none;">

            <!-- Informações do Usuário -->
            <div class="px-4 py-3 border-b border-gray-200">
                <p class="font-bold text-gray-800 truncate">{{ session.user_name }}</p>
                <p class="text-sm text-gray-500 capitalize">{{ session.user_level }}</p>
            </div>

            <!-- Link de Logout -->
            <a href="{{ url_for('logout') }}" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-100 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span>Sair</span>
            </a>
        </div>

        <!-- O Botão Flutuante com as Iniciais -->
        <button @click="open = !open" 
                class="bg-brand-orange text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:opacity-90 transform hover:scale-110 transition-all duration-200">
            <!-- Ícone de Usuário SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </button>
    </div>
    {% endif %}
    
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
